dwb_navigation_server:
  ros__parameters:
    use_sim_time: True

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_frame: odom
    bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_clear_costmap_cancel_bt_node
    - nav2_reinitialize_global_localization_cancel_bt_node
    - nav2_truncate_path_cancel_bt_node
    - nav2_recovery_cancel_bt_node
    - nav2_get_current_pose_bt_node
    - nav2_is_goal_updated_condition
    - nav2_path_shortener_bt_node
    - nav2_goal_closer_bt_node
    - nav2_recovery_sequence_bt_node
    - nav2_recovery_fallback_sequence_bt_node

  # Server parameters
  server_timeout: 20.0
  # BT execution parameters
  bt_loop_duration: 0.1
  default_server_timeout: 20.0
  # Blackboard parameters
  blackboard: {use_output_blackboard: true}
  # Path smoothing or pruning parameters
  path_smoothing: false
  max_waypoint_distance: 0.5
  min_waypoint_distance: 0.2
  waypoint_angular_offset: 0.1
  # Recovery parameters
  recovery_plugins:
  - name: "spin"
    type: "nav2_recoveries/Spin"
  - name: "back_up"
    type: "nav2_recoveries/BackUp"
  - name: "wait"
    type: "nav2_recoveries/Wait"
  - name: "clear_costmap_recovery"
    type: "nav2_recoveries/ClearCostmapRecovery"
  recovery_behavior_frequency: 10.0
  recovery_behavior_timeout: 30.0
  # Error codes
  error_code_names:
    - "GoalReached"
    - "Failed"
    - "Canceled"
    - "InvalidGoal"
    - "InvalidPath"
    - "PathBlocked"
    - "PathExpired"
    - "GoalBlocked"
    - "TFError"
    - "NoValidPlan"
    - "Timeout"
    - "Collision"
    - "RecoveryFailed"
    - "Preempted"
    - "GoalTolerance"
    - "WaypointFailed"

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      rolling_window: false
      resolution: 0.05
      track_unknown_space: true
      plugins:
      - name: static_layer
        type: nav2_costmap_2d::StaticLayer
      - name: obstacle_layer
        type: nav2_costmap_2d::ObstacleLayer
      - name: inflation_layer
        type: nav2_costmap_2d::InflationLayer
      static_layer:
        map_subscribe_transient_local: true
      obstacle_layer:
        observation_sources: laser_scan
        laser_scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        inflation_radius: 0.55
        cost_scaling_factor: 1.0
        inflation_radius: 0.5

global_planner:
  ros__parameters:
    use_sim_time: True
    allow_unknown: true
    planner_frequency: 1.0
    planner_timeout: 10.0
    max_planner_failures: 10
    planner: "GridBased"
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.5
      rolling_window: true
      width: 3.0
      height: 3.0
      resolution: 0.05
      plugins:
      - name: obstacle_layer
        type: nav2_costmap_2d::ObstacleLayer
      - name: inflation_layer
        type: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        observation_sources: laser_scan
        laser_scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        inflation_radius: 0.55
        cost_scaling_factor: 1.0

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "room.yaml"

nav2_bt_navigator:
  ros__parameters:
    use_sim_time: True

nav2_lifecycle_manager:
  ros__parameters:
    use_sim_time: True
    node_names:
    - controller_server
    - planner_server
    - map_server
    - amcl
    - bt_navigator
    autostart: true

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 20.0
    planner_plugins:
    - name: GridBased
      type: nav2_navfn_planner/NavfnPlanner
    GridBased:
      plugin: "nav2_custom_planner/CustomPlanner"
      interpolation_resolution: 0.1

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20.0
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 2000
